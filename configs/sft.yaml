# LLaMA-Factory full fine-tune shared by every SFT arm. scripts/train_sft.sh sets dataset_dir (and, for the
# brickvision_* arms, model_name_or_path=Qwen/Qwen3.5-9B and template=qwen3_5_nothink), seed, output_dir and
# gradient_accumulation_steps (global batch 64 on any GPU count).
model_name_or_path: Qwen/Qwen3-VL-8B-Instruct
trust_remote_code: true
image_min_pixels: 65536
image_max_pixels: 16777216
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: false
freeze_multi_modal_projector: false
freeze_language_model: false
deepspeed: configs/ds_zero3.json
dataset: vlm_sft
template: qwen3_vl_nothink
cutoff_len: 32768
preprocessing_num_workers: 16
dataloader_num_workers: 4
logging_steps: 10
save_steps: 500
save_total_limit: 2
overwrite_output_dir: false
plot_loss: true
report_to: [tensorboard]
per_device_train_batch_size: 1
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
bf16: true
flash_attn: sdpa
disable_gradient_checkpointing: false
use_reentrant_gc: false
ddp_timeout: 10800
