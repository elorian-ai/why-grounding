[project]
name = "grounded-reasoning"
version = "0.1.0"
description = "Code and benchmark for 'Where and Why is Grounded Reasoning Useful?'"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
# CPU steps (data, BrickVision, scoring, tables, figures). GPU: envs/gpu; RL: the envs/rl image.
dependencies = [
    "huggingface-hub>=0.36.2",
    "numpy>=2.2",
    "pandas>=2.2",
    "pillow==12.3.0",  # BrickVision and probe renders are byte-identical with this version
    "pyarrow>=20",
    "pyyaml>=6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
api = ["anthropic==0.122.0", "google-genai==2.10.0"]  # Gemini trace generation, restyling, API evaluations
paper = ["matplotlib==3.11.1", "seaborn==0.13.2"]

[dependency-groups]
dev = ["pre-commit>=4", "ruff==0.16.9"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grounded_reasoning", "brickvision"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["grounded_reasoning/items"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET", "PIE"]
ignore = ["E501", "E402", "E731", "E741", "B905", "SIM108", "RET504"]

[tool.ruff.lint.isort]
known-first-party = ["grounded_reasoning", "brickvision"]
